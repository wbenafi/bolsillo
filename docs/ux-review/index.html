<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={plus:'M12 5v14M5 12h14',arrow:'M19 12H5m6-6-6 6 6 6',right:'M5 12h14m-6-6 6 6-6 6',up:'M7 17 17 7M7 7h10v10',down:'M17 7 7 17M7 7v10h10',check:'m5 12 4 4 10-10',clock:'M12 8v4l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2V3M9 7h6M9 11h6M9 15h3',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',edit:'m14 5 5 5M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15v5',chevron:'m9 5 7 7-7 7',close:'m6 6 12 12M6 18 18 6',pocket:'M4 5h16v10l-8 6-8-6V5M4 9h16',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',file:'M14 2H5v20h14V7l-5-5v5h5M8 12h8M8 16h6',refresh:'M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2',alert:'m12 3 10 18H2L12 3M12 9v5M12 17h.01'};

const footer=()=>`<footer class="lab-footer">Propuestas de diseño · 13 de septiembre de 2026 · Revisión del código de esta versión, sin sesión autenticada. Los prototipos usan datos ficticios y guardan los datos y archivos de la demo solo en este navegador. No modifican la aplicación.</footer>`;
let page='review',active='a',scenario='normal',filter='posted',search='',screen='wallet',selectedId=null,form=null,step=1,receiptOpen=false,analysis='idle',analysisVersion=0,errors={},saveTimer,toastTimer,afterDialog=null,queuedNavigation=null;
const KEY='bolsillo-ux-proposals-v1';
const seed=()=>{const result=({currency:'CRC',posted:[{id:'m1',type:'expense',amount:'18500',description:'Compra del supermercado',date:'2026-09-12',notes:'Compras para la semana.',tags:['Alimentación'],receipt:true},{id:'m2',type:'expense',amount:'4200',description:'Café con Ana',date:'2026-09-11',notes:'',tags:['Salidas'],receipt:false},{id:'m3',type:'income',amount:'180000',description:'Aporte de septiembre',date:'2026-09-10',notes:'Presupuesto del mes.',tags:[],receipt:false},{id:'m4',type:'expense',amount:'7500',description:'Viajes de la semana',date:'2026-09-10',notes:'',tags:['Transporte'],receipt:false}],drafts:[{id:'d1',targetId:null,type:'expense',amount:'12800',description:'Compra en la feria',date:'2026-09-13',notes:'',tags:['Alimentación'],receipt:true,reviewed:false,expires:Date.now()+18*3600000},{id:'d2',targetId:'m2',type:'expense',amount:'4500',description:'Café con Ana',date:'2026-09-11',notes:'Corregir el total: incluía propina.',tags:['Salidas'],receipt:false,reviewed:true,expires:Date.now()+5*3600000}]});for(const row of [...result.posted,...result.drafts])if(row.receipt)row.receiptData={description:row.description,date:row.date,amountMinor:Number(row.amount),currency:'CRC'};return result};
let db={a:seed(),b:seed(),c:seed()},storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&['a','b','c'].every(k=>Array.isArray(saved[k]?.posted)&&Array.isArray(saved[k]?.drafts)))db=saved;}catch{storageOK=false}
for(const variant of Object.values(db))for(const row of [...variant.posted,...variant.drafts])if(row.receipt&&!row.receiptData)row.receiptData={description:row.description,date:row.date,amountMinor:Math.round(Number(String(row.amount).replace(',','.'))*(variant.currency==='USD'?100:1)),currency:variant.currency};
const data=()=>db[active];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;return true}catch{storageOK=false;return false}};
const money=(n,currency=data().currency)=>new Intl.NumberFormat('es-CR',{style:'currency',currency,minimumFractionDigits:currency==='CRC'?0:2,maximumFractionDigits:currency==='CRC'?0:2}).format(n/(currency==='CRC'?1:100));
function minor(raw){const value=String(raw).trim().replace(/\s/g,'').replace(/,/g,'.');if(!/^\d+(\.\d+)?$/.test(value))return null;const [whole,frac='']=value.split('.');const digits=data().currency==='CRC'?0:2;if(frac.length>digits)return null;const n=Number(whole+frac.padEnd(digits,'0'));return Number.isSafeInteger(n)&&n>0?n:null}
const contribution=m=>(m.type==='income'?1:-1)*(minor(m.amount)||0);
const balance=()=>data().posted.reduce((n,m)=>n+contribution(m),0);
const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'});
const newForm=()=>({id:null,targetId:null,type:'expense',amount:'',description:'',date:'2026-09-13',notes:'',tags:[],receipt:false,attachments:[],reviewed:true,dirty:false,captureOnly:active==='c',persistState:'idle'});
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function review(){return `<section class="review-intro"><div><h1>Que cada movimiento tenga un camino claro.</h1><p class="lead">Agregar rápido. Consultar con tranquilidad. Editar con intención. Retomar exactamente donde lo dejaste.</p><p class="small muted">Tres propuestas interactivas para mejorar los flujos de Bolsillo, manteniendo su identidad y su voz. El uso principal es móvil, confirmado por vos. Las tres experiencias también se adaptan a pantallas amplias.</p></div><aside class="recommendation"><h3>Flujo elegido: Paso a paso</h3><p>Empezá a mano o con un comprobante, completá los datos y revisalos antes de registrar. La entrada manual aparece primero y tiene una acción destacada.</p><a class="btn primary" href="#b">Probar el flujo elegido ${icon('right')}</a></aside></section>
<section class="review-section"><div class="section-top"><h2>Lo que más pesa hoy</h2><span class="small muted">Hallazgos del código · impacto estimado</span></div>
<div class="finding"><div class="severity">Alta prioridad<br>Consulta</div><div><h3>Consultar abre un formulario de edición</h3><p>Cada fila lleva directamente a <code>/edit</code>. Ver notas o comprobantes exige entrar en un contexto de modificación. Con permisos limitados, la ruta bloquea incluso la consulta.</p><span class="source">components/transaction-list.tsx:33 · app/wallets/[walletId]/transactions/[transactionId]/edit/page.tsx:27</span></div><div><h3>Crear un destino de lectura</h3><p>Detalle con monto, fecha, etiquetas, notas y comprobantes. «Editar» inicia una acción explícita. Al guardar, regresar al detalle y conservar el contexto de la lista.</p></div></div>
<div class="finding"><div class="severity">Alta prioridad<br>Continuidad</div><div><h3>Dos formularios, dos promesas de guardado</h3><p>El flujo manual no guarda borradores. El asistido guarda tras 650 ms, pero los enlaces de navegación no pasan por su función de salida. «Cancelar» puede convertirse en «Continuar después» al aparecer un borrador.</p><span class="source">components/transaction-form.tsx:44–263 · components/assisted-transaction-form.tsx:121–129,245–249,317</span></div><div><h3>Una política de borradores para todos</h3><p>El mismo editor, con capacidades opcionales. Estado inmediato «Cambios sin guardar», salida que espera confirmación y pendientes identificados como «Nuevo» o «Edición». Nunca modificar el saldo desde un borrador.</p></div></div>
<div class="finding"><div class="severity">Alta prioridad<br>Confianza</div><div><h3>El comprobante y las decisiones compiten</h3><p>Vista previa, acciones de lectura, sugerencias y formulario se apilan. Fecha y tipo ya tienen valores por defecto; la extracción solo aplica automáticamente sobre campos vacíos.</p><span class="source">components/assisted-transaction-form.tsx:60–61,139–151,280–307</span></div><div><h3>Revisar al lado del dato</h3><p>Distinguir datos sugeridos, elegidos y pendientes. Mostrar discrepancias junto al campo. Pedir decisión explícita sobre monto dudoso y moneda distinta; conservar siempre lo escrito.</p></div></div>
<div class="finding"><div class="severity">Alta prioridad<br>Integridad</div><div><h3>Algunas acciones contradicen el contexto</h3><p>La moneda de un bolsillo con movimientos puede cambiar sin conversión. CRC y USD interpretan de forma distinta la unidad guardada. Un bolsillo archivado aún enlaza a edición, y el borrado de movimientos no comprueba el archivo.</p><span class="source">components/wallet-form.tsx:69 · convex/wallets.ts:127 · lib/money.ts:3 · convex/transactions.ts:104</span></div><div><h3>Alinear interfaz y reglas del servidor</h3><p>Bloquear la moneda después del primer movimiento o definir una migración explícita. En archivo o consulta, ofrecer detalle y ocultar modificaciones; validar la misma regla en el backend.</p></div></div>
<div class="finding"><div class="severity">Prioridad media<br>Orientación</div><div><h3>Filtrar cambia el significado del saldo principal</h3><p>La cabecera pasa a «Disponible filtrado» y reemplaza el saldo real por el neto de los registros seleccionados. La lista ofrece etiquetas, pero no búsqueda, fecha ni tipo.</p><span class="source">app/wallets/[walletId]/page.tsx:45–51,83,94–110</span></div><div><h3>Separar saldo y resultados</h3><p>Mantener el saldo del bolsillo estable. Mostrar cantidad y neto de la búsqueda junto a los filtros, con una forma clara de limpiarlos.</p></div></div></section>
<section class="review-section"><div class="section-top"><h2>Tres maneras de resolverlo</h2><span class="small muted">Mismos datos. Distintas decisiones.</span></div><div class="proposal-options"><article class="proposal-option"><div class="letter">A</div><h3>Registro ágil</h3><p>Un editor compacto para el uso diario. El monto y la descripción primero; detalles adicionales cuando hacen falta.</p><div class="flow-line"><span>Completar</span>${icon('right')}<span>Guardar</span>${icon('right')}<span>Ver</span></div><a class="btn" href="#a">Probar propuesta A</a></article><article class="proposal-option"><div class="letter">B</div><h3>Paso a paso</h3><p>Capturar, completar y confirmar. La revisión del comprobante tiene un momento propio, con las dudas junto al campo.</p><div class="flow-line"><span>Capturar</span>${icon('right')}<span>Revisar</span>${icon('right')}<span>Confirmar</span></div><a class="btn" href="#b">Probar propuesta B</a></article><article class="proposal-option"><div class="letter">C</div><h3>Capturar y resolver</h3><p>Capturá algo rápido desde el teléfono y terminalo después. Una bandeja de pendientes separa recopilar de registrar.</p><div class="flow-line"><span>Capturar</span>${icon('right')}<span>Retomar</span>${icon('right')}<span>Registrar</span></div><a class="btn" href="#c">Probar propuesta C</a></article></div></section>
<section class="review-section"><div class="section-top"><h2>Recorrido por el resto de la aplicación</h2><span class="small muted">Cobertura y propuestas transversales</span></div>
${audit('Inicio y creación de bolsillo','La organización por propósito y las tarjetas con saldos son una base clara. Añadir el número de pendientes en cada bolsillo y acceso a continuar desde el inicio. Después de crear, ofrecer «Agregar el primer movimiento». Explicar que el saldo se calcula con ingresos y gastos, no con un campo de saldo editable.','app/page.tsx · components/wallet-card.tsx · components/wallet-form.tsx')}
${audit('Bolsillo, búsqueda y filtros','Conservar el saldo real y agregar un resumen independiente del resultado filtrado. Mantener filtros y posición de lectura al volver desde un detalle. A y C incluyen búsqueda; las tres distinguen movimientos registrados de pendientes. «Sin resultados» debe ofrecer limpiar, y «sin movimientos» debe invitar a registrar el primero.','app/wallets/[walletId]/page.tsx · components/transaction-list.tsx')}
${audit('Etiquetas y clasificación','La creación en contexto y los colores consistentes funcionan bien. Unificar «Tags» y «Etiquetas» en el lenguaje visible; plegar el selector si hay muchas opciones. Informar cuántos movimientos se verán afectados al eliminar una etiqueta; conservar la explicación actual de que no se eliminan los movimientos.','components/tag-selector.tsx · components/tag-dialog.tsx · app/wallets/[walletId]/tags/page.tsx')}
${audit('Archivar, restaurar y eliminar','Separar claramente archivar (reversible) de eliminar (permanente). El detalle archivado debe seguir siendo consultable. Antes de un borrado, mostrar nombre, monto, archivos afectados y saldo resultante. No prometer «Deshacer» sin retención y reversión reales.','app/archived/page.tsx · convex/transactions.ts · convex/wallets.ts')}
${audit('Comprobantes y archivos','Ya hay límites, vista previa, descarga, renombre, control de revisiones y errores de carga. Llevar la consulta al detalle de lectura. Unificar la gestión de archivos entre el piloto y el editor manual, sin hacer depender adjuntar de usar IA. Separar la carga de archivos de su lectura y del registro del movimiento.','components/transaction-files-field.tsx · components/receipt-documents.tsx · components/file-viewer-dialog.tsx')}
${audit('Compartir resumen','La implementación comparte o descarga una imagen del bolsillo. Agregar una vista previa que identifique filtros activos y el contenido incluido antes de entregar la imagen al sistema. Nombrar la acción «Compartir resumen» para evitar sugerir que se comparte acceso al bolsillo.','components/share-wallet-button.tsx · lib/wallet-share-image.ts')}
${audit('Ingreso, cuenta y permisos','Clerk ofrece las pantallas de ingreso y registro. Verificar en una sesión real el regreso al enlace original y la recuperación tras expirar sesión. Cuando cambia una capacidad, conservar la consulta y lo escrito. Aclarar las lecturas restantes junto al uso de IA. No sustituir datos inexistentes por un indicador de carga indefinido.','app/sign-in · app/sign-up · components/viewer-context.tsx · components/ai-account-usage.tsx')}
${audit('Accesibilidad, errores y conexiones lentas','Asociar cada error al campo y enfocar el primer dato inválido. El monto del formulario asistido ya ofrece parte de este patrón. Mejorar contraste de texto coral y etiquetas azules seleccionadas; usar el token de primer plano oscuro. Dar nombre accesible al visor de archivos y detener animaciones con movimiento reducido. En carga, impedir cambios que no entren en el envío o conservarlos explícitamente.','components/transaction-form.tsx:195–245 · components/assisted-transaction-form.tsx:229–231 · components/file-viewer-dialog.tsx:93 · app/globals.css:26,63,178,211,477')}
${audit('Edición simultánea y pérdida de acceso','Las ediciones manuales no envían una revisión del movimiento y pueden sobrescribir cambios de otra sesión; el guardado asistido sí comprueba una revisión base. Unificar esa protección. Separar permiso de archivos y permiso de IA: un borrador con archivos puede quedar sin una salida de guardado si se revoca el acceso. Los enlaces a movimientos eliminados necesitan recuperación explícita.','convex/transactions.ts:77–91 · convex/transactionDrafts.ts:153–156 · components/assisted-transaction-form.tsx:294 · app/wallets/[walletId]/transactions/[transactionId]/edit/page.tsx:21–26')}
${audit('Superadmin y auditoría','Revisado a nivel de estructura de código: cuentas, roles, acceso a funciones y registro de auditoría. Priorizar confirmación contextual en suspensión o cambios de rol, estados de operación visibles y errores recuperables. Validar estos flujos aparte con una cuenta de prueba y permisos reales; no se simulan cambios administrativos en este prototipo.','app/superadmin/page.tsx · app/superadmin/accounts/[accountId]/page.tsx · app/superadmin/audit/page.tsx')}
</section><section class="review-section two-column"><div><h2>Conservar lo que funciona</h2><ul><li>Identidad cálida, teal para acciones y colores semánticos para ingresos y gastos.</li><li>Voz clara: «El saldo cambia solo al guardar el movimiento».</li><li>Extracción con revisión humana, detección de moneda distinta y posibles duplicados.</li><li>Archivos privados y comprobaciones de revisiones en el servidor.</li></ul></div><div><h2>Validar con personas</h2><ul><li>Registrar un gasto sin comprobante y explicar cuándo cambió el saldo.</li><li>Consultar un comprobante sin entrar en edición.</li><li>Salir de una edición y retomar el borrador sin confundirlo con el movimiento vigente.</li><li>Corregir un dato dudoso y encontrar qué se guardó después.</li></ul><p class="small muted">Medir finalización, errores de monto/fecha, tiempo de reanudación y seguridad percibida. Son criterios propuestos, no resultados de un estudio.</p></div></section>${footer()}`}
function audit(title,copy,source){return `<details class="audit"><summary>${title}</summary><p>${copy}</p><span class="source">${source}</span></details>`}
const concepts={a:{title:'Registro ágil',desc:'Un movimiento, un editor. Lo esencial a mano; los detalles a un toque.',why:'Reduce la navegación para registrar gastos cotidianos y hace explícita la diferencia entre consultar y editar.',cost:'El formulario debe compartir borradores entre cuentas con y sin asistencia. Es la base más pequeña, pero requiere resolver la política de guardado.',steps:['Agregá un gasto con monto y descripción.','Guardalo y abrí su detalle.','Editalo, elegí continuar después y retomá el pendiente.']},b:{title:'Paso a paso',desc:'A mano o con un comprobante. Completá los datos y revisalos antes de registrar.',why:'Distribuye las decisiones y da contexto a lo que leyó la IA. Los datos dudosos se resuelven donde se editan.',cost:'Agrega una confirmación al registro. Conviene para comprobantes; puede ser lento para un gasto simple. La entrada manual omite la captura.',steps:['Elegí Completar manualmente o usá un comprobante.','Completá los datos y revisá cualquier monto señalado.','Continuá al resumen; guardá o dejalo pendiente.']},c:{title:'Capturar y resolver',desc:'Capturá ahora, resolvé después. Una bandeja de pendientes pensada para el teléfono.',why:'Separa dos momentos: guardar un recuerdo del gasto y revisar sus datos. En móvil, la bandeja lleva al detalle; en escritorio, el inspector queda al lado.',cost:'Mayor trabajo en rutas, historial y selección. El siguiente borrador se abre por decisión del usuario; nunca se guardan varios a ciegas.',steps:['Capturá una descripción o un comprobante.','Guardalo en pendientes sin modificar el saldo.','Retomalo, revisá sus datos y registralo.']}};
function comparison(){return `<section><h1>Elegir por el trabajo que querés facilitar.</h1><p class="muted">Las tres propuestas comparten lectura segura, borradores identificables y saldo visible. La diferencia está en cómo distribuyen las decisiones.</p><div class="table-wrap comparison"><table><thead><tr><th>Criterio</th><th>A · Registro ágil</th><th>B · Paso a paso</th><th>C · Capturar y resolver</th></tr></thead><tbody><tr><td>Mejor situación</td><td>Registro cotidiano desde el teléfono.</td><td>Comprobante con datos por confirmar.</td><td>Captura móvil durante el día y revisión posterior.</td></tr><tr><td>Agregar</td><td>Completar y guardar en un editor.</td><td>Capturar → completar → confirmar.</td><td>Capturar → dejar pendiente → retomar y registrar.</td></tr><tr><td>Ver / editar</td><td>Detalle → edición explícita → detalle.</td><td>Detalle → completar → confirmar → detalle.</td><td>Seleccionar fila → inspector → editar.</td></tr><tr><td>Continuar borrador</td><td>Pendientes visibles en el bolsillo.</td><td>Retomar en el paso de datos, con dudas señaladas.</td><td>Cola de pendientes y siguiente por elección.</td></tr><tr><td>Principal ventaja</td><td>Menos pasos para registrar.</td><td>Más espacio para comprender y verificar.</td><td>Menos cambios de contexto.</td></tr><tr><td>Principal costo</td><td>Revisión menos guiada de comprobantes complejos.</td><td>Confirmación adicional para gastos simples.</td><td>Más complejidad de navegación adaptable.</td></tr><tr><td>Esfuerzo relativo</td><td>Medio: editor, borradores y ruta de detalle.</td><td>Medio/alto: estados del flujo y revisión.</td><td>Alto: lista/inspector, URL, móvil e historial.</td></tr><tr><td>Prototipo</td><td><a class="btn" href="#a">Probar A</a></td><td><a class="btn" href="#b">Probar B</a></td><td><a class="btn" href="#c">Probar C</a></td></tr></tbody></table></div></section><section class="review-section"><h2>Qué implica implementar cada experiencia</h2><div class="two-column"><div><h3>Prerrequisitos compartidos</h3><p>Resolver moneda y archivo en el servidor. Introducir una ruta de detalle consultable. Unificar el estado de nuevo movimiento, edición y borrador; cubrir salida, expiración y conflicto de revisión.</p><h3>Si elegís A · Registro ágil</h3><p>Unificar el editor, plegar notas y etiquetas y mostrar el efecto en saldo. Priorizar el registro en una pantalla, con acceso opcional al comprobante. Mantener filtros y posición al volver desde el detalle.</p></div><div><h3>Si elegís B · Paso a paso</h3><p>Implementar captura, revisión y confirmación con estados persistidos. La entrada manual omite captura. Asociar cada sugerencia a su comprobante y conservar decisiones previas al volver entre pasos.</p><h3>Si elegís C · Capturar y resolver</h3><p>Hacer de los pendientes un destino principal. Permitir captura incompleta y revisión posterior. En móvil, usar lista y detalle sucesivos; en escritorio, sumar un inspector. La navegación debe conservar selección y contexto.</p></div></div><div class="note">Los prototipos prueban la interacción. Guardado remoto, permisos, concurrencia, carga de archivos y extracción real requieren implementación y pruebas en la aplicación. La persistencia aquí es solo local; si el navegador la bloquea, el prototipo lo informa.</div></section>${footer()}`}
function rationale(){const c=concepts[active];return `<aside class="rationale"><div><h3>Recorrido sugerido</h3><ol>${c.steps.map(t=>`<li>${t}</li>`).join('')}</ol><div class="flow-links">${btn('Agregar','new','small')}${btn('Ver','jump-view','small')}${btn('Editar','jump-edit','small')}${btn('Continuar borrador','jump-draft','small')}</div></div><div><h3>Qué mejora</h3><p>${c.why}</p></div><div><h3>Qué exige</h3><p>${c.cost}</p><a href="#compare">Comparar los tres enfoques</a></div></aside>`}
function render(){document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(page==='review')$('#main').innerHTML=review();else if(page==='compare')$('#main').innerHTML=comparison();else{const c=concepts[active];$('#main').innerHTML=`<section class="concept-header"><div><h1><span class="concept-letter">${active.toUpperCase()}</span>${c.title}</h1><p>${c.desc}</p></div><div class="concept-controls"><label for="scenario" class="small" style="margin:0">Simular</label><select id="scenario"><option value="normal">Uso normal</option><option value="offline">Falla al guardar</option><option value="readonly">Solo consulta / archivado</option><option value="expired">Borrador vencido</option><option value="empty">Sin movimientos</option><option value="unreadable">Comprobante ilegible</option><option value="mismatch">Comprobante en USD</option><option value="usd">Bolsillo en USD</option></select>${btn(icon('refresh')+' Reiniciar','reset','small')}</div></section><div class="demo-strip"><span>Prototipo interactivo · Datos ficticios · ${storageOK?'Guardado en este navegador':'Persistencia bloqueada: datos solo en esta pestaña'}</span>${btn('Ampliar prototipo','focus','text small')}</div><div class="prototype-grid ${active}"><section class="app-frame" aria-label="Prototipo de ${c.title}"><header class="app-header">${btn(brand(),'home','text','aria-label="Ir a bolsillos"')}<span class="pocket-name">Día a día</span><span class="profile"><span class="profile-name">Cuenta de ejemplo</span><span class="avatar" aria-hidden="true">ME</span></span></header><div id="app-content"></div></section>${rationale()}</div>${footer()}`;$('#scenario').value=scenario;renderApp()} }
function renderApp(){const target=$('#app-content');if(!target)return;if(screen==='home'){target.innerHTML=homeView();return}if(screen==='expired'){target.innerHTML=`<div class="app-body narrow">${btn(icon('arrow')+' Volver al bolsillo','wallet','text')}<div class="empty">${icon('clock')}<h2>Este borrador venció</h2><p>Los borradores se conservan por 24 horas. El movimiento no se registró y el saldo no cambió.</p><p>No podemos recuperar estos datos desde el borrador.</p>${btn('Crear un movimiento','new','primary')}${btn('Ver otros pendientes','drafts','text')}</div></div>`;return}if(active==='c'){target.innerHTML=`<div class="workspace ${screen==='wallet'?'':'has-selection'}"><section class="workspace-list" aria-label="Lista de movimientos">${walletHeader(true)}${listView()}</section><section class="workspace-detail" aria-label="Detalle seleccionado">${screen==='wallet'?`<div class="empty">${icon('pocket')}<h2>Todo a mano.</h2><p>Elegí un movimiento para consultar sus datos<br>o retomá uno de tus pendientes.</p>${btn(icon('plus')+(active==='c'?' Capturar movimiento':' Agregar movimiento'),'new','primary')}</div>`:screen==='detail'?detailView():editorView()}</section></div>`}else target.innerHTML=screen==='wallet'?`<div class="app-body">${walletHeader()}${listView()}</div>`:screen==='detail'?detailView():editorView();bindSearch();updateImpact();}
function homeView(){return `<div class="app-body"><h2>Tus bolsillos</h2><p class="muted">Tu dinero, por propósito.</p><div class="wallets-list"><button class="wallet-summary" data-action="wallet"><strong>Día a día</strong><span class="sum mono">${money(balance())}</span><small>${data().posted.length} movimientos · ${data().currency}</small><p style="margin:14px 0 0"><span class="badge warn">${data().drafts.length} pendientes</span></p></button><div class="wallet-summary"><strong>Tu próximo propósito</strong><p class="small muted" style="margin:15px 0">Un bolsillo para separar el dinero que querés organizar.</p>${btn(icon('plus')+' Crear bolsillo','new-wallet','small')}</div></div><div class="note">Los borradores no están incluidos en el saldo. Podés retomarlos desde su bolsillo.</div>${btn('Ver ejemplo archivado','archive-demo','text')}</div>`}
function walletHeader(compact=false){return `<div class="wallet-top"><div class="flex spread"><h2>Día a día</h2>${!compact?btn('Bolsillos','home','text small'):''}</div><div class="balance-inline"><span>Saldo disponible</span><strong class="mono">${money(balance())}</strong></div><div class="wallet-actions">${scenario==='readonly'?'<span class="badge neutral">Solo consulta</span>':btn(icon('plus')+(active==='c'?' Capturar movimiento':' Agregar movimiento'),'new','primary')}<span class="muted small">${data().currency}</span></div></div>${scenario==='readonly'?'<div class="note">Podés consultar tus movimientos y comprobantes. Este ejemplo está en modo de solo lectura.</div>':''}${data().drafts.length&&scenario!=='readonly'&&!compact?`<div class="draft-nudge"><div><strong>${data().drafts.length} movimientos por terminar</strong><small>Los borradores no cambian tu saldo.</small></div>${btn('Ver pendientes','drafts','small')}</div>`:''}`}
function listView(){const drafts=filter==='drafts';return `<div class="tabs" aria-label="Tipo de registros">${btn(`Movimientos <span class="small">${data().posted.length}</span>`,'posted',filter==='posted'?'active':'')}${scenario!=='readonly'?btn(`Pendientes <span class="small">${data().drafts.length}</span>`,'drafts',drafts?'active':''):''}</div><div class="search-row"><label class="searchbox" style="margin:0">${icon('search')}<input id="search" aria-label="Buscar movimientos" value="${esc(search)}" placeholder="Buscar por nombre o etiqueta"></label></div><div id="rows">${rowsView()}</div>`}
function rowsView(){let rows=filter==='drafts'?data().drafts:data().posted;const s=search.toLocaleLowerCase();rows=rows.filter(m=>(m.description+' '+m.tags.join(' ')).toLocaleLowerCase().includes(s));if(!rows.length)return `<div class="empty">${icon(search?'search':'pocket')}<h3>${search?'No encontramos coincidencias':filter==='drafts'?'Estás al día':'Tu primer movimiento empieza acá'}</h3><p>${search?'Probá otro nombre o limpiá la búsqueda.':filter==='drafts'?'Los movimientos que dejés para después aparecerán aquí.':'Agregá un ingreso o un gasto para empezar a llevar el saldo.'}</p>${search?btn('Limpiar búsqueda','clear-search'):scenario!=='readonly'?btn('Agregar movimiento','new','primary'):''}</div>`;return `${search?`<p class="small muted">${rows.length} resultados${filter==='posted'?` · Neto ${money(rows.reduce((n,m)=>n+contribution(m),0))}`:''}. El saldo del bolsillo no cambia.</p>`:`<p class="list-label">${filter==='drafts'?'Sin registrar · Se conservan por 24 horas':'Septiembre de 2026'}</p>`}${rows.map(m=>{const d=filter==='drafts',expired=d&&m.expires<Date.now();return `<button type="button" class="movement-row ${selectedId===m.id?'selected':''}" data-action="${d?'resume':'view'}" data-id="${m.id}"><span class="direction ${d?'draft':m.type}">${icon(d?'clock':m.type==='income'?'down':'up')}</span><span><strong>${esc(m.description)||'Movimiento sin nombre'}</strong><small>${d?`${m.targetId?'Edición pendiente':'Nuevo movimiento'} · ${expired?'Venció':Math.max(1,Math.ceil((m.expires-Date.now())/3600000))+' h restantes'}`:dateLabel(m.date)}${active==='b'&&attachmentCount(m)?` · ${attachmentCount(m)} ${attachmentCount(m)===1?'adjunto':'adjuntos'}`:m.receipt?' · Comprobante':''}</small>${d&&!m.reviewed?'<small>Falta revisar el monto</small>':''}</span><span class="row-end"><strong class="amount ${d?'muted':m.type}">${d&&!minor(m.amount)?'Sin monto':(m.type==='income'?'+':'−')+money(minor(m.amount)||0)}</strong>${d?`<span class="badge ${expired?'neutral':'warn'}">${expired?'Vencido':'Continuar'}</span>`:''}</span></button>`}).join('')}`}
function bindSearch(){const s=$('#search');if(s)s.addEventListener('input',e=>{search=e.target.value;$('#rows').innerHTML=rowsView()})}
function detailView(){const m=data().posted.find(m=>m.id===selectedId);if(!m)return `<div class="empty"><h2>El movimiento ya no está disponible</h2>${btn('Volver al bolsillo','wallet')}</div>`;const draft=data().drafts.find(d=>d.targetId===m.id);return `<div class="app-body narrow"><div class="editor-top">${btn(icon('arrow')+' Movimientos','wallet','text')}<span class="badge neutral">Registrado</span></div>${draft?`<div class="note warn">Hay una edición pendiente. Los datos de abajo son los que están registrados. ${scenario!=='readonly'?btn('Continuar edición','resume','text small',`data-id="${draft.id}"`):'La edición está deshabilitada en modo consulta.'}</div>`:''}<div class="detail-heading"><div><h2>${esc(m.description)}</h2><span class="muted small">${m.type==='income'?'Ingreso':'Gasto'} · Día a día</span></div>${scenario!=='readonly'?btn(icon('edit')+' Editar','edit','','aria-label="Editar movimiento"'):''}</div><p class="detail-amount ${m.type}">${m.type==='income'?'+':'−'}${money(minor(m.amount))}</p><p class="detail-label">Registrado el ${dateLabel(m.date)} · ${data().currency}</p><dl class="definition"><div><dt>Fecha</dt><dd>${dateLabel(m.date)}</dd></div><div><dt>Etiquetas</dt><dd>${m.tags.length?m.tags.map(t=>`<span class="badge neutral">${esc(t)}</span>`).join(' '):'Sin etiquetas'}</dd></div><div><dt>Notas</dt><dd>${esc(m.notes)||'Sin notas'}</dd></div></dl>${active==='b'?attachmentsView(m):m.receipt?`<div class="attachment-row"><div class="flex">${icon('file')}<div><p>Comprobante de ejemplo</p><small>Datos ficticios del movimiento</small></div></div>${btn('Ver','receipt-view','small')}</div>`:'<p class="small muted">Sin comprobantes adjuntos.</p>'}<div class="note flex spread"><span>Saldo actual del bolsillo</span><strong class="mono">${money(balance())}</strong></div>${active==='c'&&data().drafts.length&&scenario!=='readonly'?btn('Revisar siguiente pendiente '+icon('right'),'next-draft','primary'):''}${scenario!=='readonly'?`<details class="danger-zone"><summary>Más acciones</summary>${btn(icon('trash')+' Eliminar movimiento','delete','danger')}</details>`:'<p class="small muted">Modo consulta: los movimientos y sus archivos se conservan.</p>'}</div>`}
function stepper(){return `<ol class="steps" aria-label="Progreso del movimiento">${['Empezar','Completar','Confirmar'].map((label,i)=>{const content=`<span class="step-number">${i+1}</span>${label}`;return `<li class="${step===i+1?'active':step>i+1?'done':''}" ${step===i+1?'aria-current="step"':''}>${i+1<step?`<button type="button" data-action="go-step" data-step="${i+1}" aria-label="Volver a ${label}">${content}</button>`:content}</li>`}).join('')}</ol>`}
function editorView(){if(!form)form=newForm();const editing=!!form.targetId;const resumed=!!form.resumed;return `<div class="app-body narrow"><div class="editor-top">${btn(icon('arrow')+' '+(active==='c'?'Lista':'Día a día'),'leave','text')}<span id="save-status" class="save-status" role="status">${form.persistState==='error'?'No se guardaron los cambios':form.persistState==='pending'?'Cambios sin guardar':form.persistState==='saved'?'Borrador guardado · En este navegador':resumed?'Borrador recuperado · Sin registrar':'El saldo cambia al registrar'}</span></div><div class="editor-title"><h2>${form.captureOnly?'Capturar movimiento':editing?'Editar movimiento':resumed?'Continuar movimiento':'Nuevo movimiento'}</h2><p>${form.captureOnly?'Guardá lo que sabés ahora. Podés completar el resto después.':editing?'El movimiento original sigue vigente hasta guardar los cambios.':resumed?'Retomá tus datos. Todavía no están incluidos en el saldo.':'Día a día · '+data().currency}</p></div>${resumed?`<div class="note ${!form.reviewed?'warn':''}">${form.targetId?'Edición pendiente':'Borrador'} · ${form.expires?Math.max(1,Math.ceil((form.expires-Date.now())/3600000))+' h restantes':'24 horas'}${!form.reviewed?' · Falta revisar el monto.':''}</div>`:''}${active==='b'?stepper():''}<form id="movement-form" class="${active==='b'?'step-form':''}" novalidate>${active==='b'&&step===1?captureView():active==='b'&&step===3?confirmView():form.captureOnly?quickCaptureView():fieldsView()}${saveFooter()}</form></div>`}
function quickCaptureView(){return `<div class="field"><label for="description">¿Qué querés recordar?</label><input id="description" name="description" placeholder="Ej. Compra en la feria" maxlength="100" value="${esc(form.description)}" aria-invalid="${!!errors.description}" aria-describedby="capture-help"><p class="field-hint" id="capture-help">Una descripción alcanza para empezar. El monto y la fecha se revisan después.</p>${fieldError('description')}</div><details class="receipt-tool" ${receiptOpen?'open':''}><summary>${icon('receipt')} Agregar un comprobante ${icon('chevron')}</summary><div class="receipt-panel">${receiptCapture()}</div></details><div class="note">Esto crea un pendiente. Tu saldo cambia cuando lo revisás y registrás.</div>`}
function receiptMarkup(m=form){const receipt=m?.receiptData??{description:'Compra en la feria',date:'2026-09-13',amountMinor:12800,currency:'CRC'};return `<div class="receipt" aria-label="Comprobante ficticio"><header><strong>${esc(receipt.description)}</strong><span>Día a día · Comprobante de ejemplo</span></header><div class="receipt-row"><span>Fecha</span><span>${dateLabel(receipt.date)}</span></div><div class="receipt-row"><span>Concepto</span><span>Compra de ejemplo</span></div><footer class="receipt-row"><span>Total</span><span>${money(receipt.amountMinor,receipt.currency)}</span></footer><div class="demo-label">DATOS FICTICIOS · NO ES UN COMPROBANTE REAL</div></div>`}
function captureView(){return `<section><h3>¿Cómo querés empezar?</h3><p class="small muted">Ingresá los datos o completalos con un comprobante.</p><button type="button" class="manual-entry" data-action="manual" aria-describedby="manual-entry-help">${icon('edit')}<span class="manual-entry-copy"><strong>Completar manualmente</strong><small id="manual-entry-help">Ingresá los datos. Podés adjuntar archivos después.</small></span>${icon('right')}</button><h3>Con un comprobante</h3>${receiptCapture()}</section>`}

cha</label><input id="date" name="date" type="date" value="${esc(form.date)}" required aria-invalid="${!!errors.date}" ${errors.date?'aria-describedby="date-error"':''}>${fieldError('date')}${form.receipt?'<p class="field-hint">Fecha visible para revisar, aunque coincida con hoy.</p>':''}</div><details class="optional" ${form.notes||form.tags.length?'open':''}><summary>Notas y etiquetas <span class="muted small">· Opcional</span></summary><div class="field"><label for="notes">Notas</label><textarea id="notes" name="notes" rows="2" maxlength="500" placeholder="Un detalle para recordar">${esc(form.notes)}</textarea></div><span class="small" style="display:block;margin-bottom:8px;font-weight:650">Etiquetas</span><div class="tag-picks">${['Alimentación','Transporte','Salidas'].map(t=>`<button type="button" data-action="tag" data-value="${t}" aria-pressed="${form.tags.includes(t)}">${t}</button>`).join('')}</div></details>${movementReceiptAccess()}`}
let attaching=false,attachmentPreviewUrl=null;
const attachmentTypes={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',pdf:'application/pdf',txt:'text/plain'};
const attachmentCount=m=>(m?.receipt?1:0)+(m?.attachments?.length||0);
const attachmentSize=n=>n<1024?`${n} B`:n<1024*1024?`${Math.ceil(n/1024)} KB`:`${(n/1024/1024).toLocaleString('es-CR',{maximumFractionDigits:1})} MB`;
function attachmentList(m,editable=false){

}
function attachmentsView(m,editable=false){

function readAttachment(file,type){return new Promise((resolve,reject)=>{
 const reader=new FileReader();
 reader.onload=()=>resolve({id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2),name:file.name,type,size:file.size,lastModified:file.lastModified,content:`data:${type};base64,${String(reader.result).split(',')[1]}`});
 reader.onerror=()=>reject(new Error('No pudimos abrir el archivo.'));
 reader.readAsDataURL(file);
})}
async function addAttachments(files){
 if(active!=='b'||!form||scenario==='readonly'||form.submitting||attaching||step!==2)return;
 const selected=Array.from(files);if(!selected.length)return;
 const initial=form,currentActive=active,previous=form.attachments||[],accepted=[],issues=[];
 attaching=true;delete errors.attachments;renderApp();
 for(const file of selected){
  const type=attachmentTypes[file.name.split('.').pop().toLowerCase()];
  if(!type||(file.type&&file.type!==type)){issues.push(`${file.name}: elegí un archivo JPG, PNG, WebP, PDF o TXT.`);continue}
  if(!file.size||file.size>2*1024*1024){issues.push(`${file.name}: elegí un archivo con contenido, de hasta 2 MB.`);continue}
  if(file.name.length>180){issues.push('Acortá el nombre del archivo a 180 caracteres o menos.');continue}
  if([...previous,...accepted].some(item=>item.name===file.name&&item.size===file.size&&item.lastModified===file.lastModified)){issues.push(`${file.name} ya está adjunto.`);continue}
  if(attachmentCount(initial)+accepted.length>=5){issues.push(`${file.name}: ya llegaste al límite de 5 archivos.`);continue}
  try{accepted.push(await readAttachment(file,type))}catch{issues.push(`${file.name}: no pudimos abrirlo. Intentá seleccionarlo otra vez.`)}
 }
 attaching=false;
 if(form!==initial||active!==currentActive||scenario==='readonly')return;
 let added=accepted.length;
 if(added){
  form.attachments=[...previous,...accepted];changed();
  if(!stash()){
   form.attachments=previous;stash();added=0;
   issues.push(scenario==='offline'?'No pudimos guardar los archivos. Elegí «Uso normal» y volvé a agregarlos.':'Este navegador no pudo guardar los archivos. Probá con archivos más pequeños o liberá espacio y volvé a agregarlos.');
  }
 }
 if(issues.length)errors.attachments=issues;
 renderApp();$('#attachment-add')?.focus({preventScroll:true});
 if(added)toast(`${added===1?'Archivo adjunto':'Archivos adjuntos'}. Los datos del movimiento no cambiaron.`);
}
function viewAttachment(id){
 const m=form||data().posted.find(row=>row.id===selectedId),file=m?.attachments?.find(item=>item.id===id);
 if(!file)return;
 try{
  if(!Object.values(attachmentTypes).includes(file.type)||!file.content.startsWith(`data:${file.type};base64,`))throw new Error();
  const bytes=Uint8Array.from(atob(file.content.split(',')[1]),character=>character.charCodeAt(0));
  attachmentPreviewUrl=URL.createObjectURL(new Blob([bytes],{type:file.type}));
  const preview=file.type.startsWith('image/')?`<img class="attachment-preview" src="${attachmentPreviewUrl}" alt="${esc(file.name)}">`:file.type==='text/plain'?`<pre class="attachment-text">${esc(new TextDecoder().decode(bytes))}</pre>`:`<a class="btn" href="${attachmentPreviewUrl}" target="_blank" rel="noopener noreferrer">Abrir PDF en otra pestaña ${icon('right')}</a>`;
  openDialog(esc(file.name),`${attachmentSize(file.size)} · Adjunto sin analizar`,`${preview}<a class="btn" href="${attachmentPreviewUrl}" download="${esc(file.name)}">Descargar archivo</a>${btn('Volver al movimiento','dialog-close','primary')}`);
 }catch{toast('No pudimos abrir este archivo. Volvé a agregarlo desde la edición del movimiento.')}
}

function valid(){errors={};if(!minor(form.amount))errors.amount=data().currency==='CRC'?'Ingresá un monto entero mayor que cero, sin separadores de miles.':'Ingresá un monto mayor que cero, con hasta dos decimales.';if(!form.description.trim())errors.description='Contanos a qué corresponde este movimiento.';const date=new Date(form.date+'T12:00:00Z');if(!form.date||!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==form.date)errors.date='Elegí una fecha válida.';if(form.receipt&&!form.reviewed)errors.amount=errors.amount||'Revisá el monto del comprobante y confirmalo antes de continuar.';if(Object.keys(errors).length){renderApp();const first=$('[aria-invalid="true"]');first?.focus();return false}return true}

function setScenario(value){clearTimeout(saveTimer);scenario=value;errors={};if(value==='normal'){if(form?.dirty)stash();renderApp();return}if(value==='usd'){db[active]=seed();data().currency='USD';data().posted.forEach(m=>{m.amount=(Number(m.amount)/100).toFixed(2);if(m.receiptData)m.receiptData={...m.receiptData,currency:'USD'}});data().drafts.forEach(d=>{d.amount=(Number(d.amount)/100).toFixed(2);if(d.receiptData)d.receiptData={...d.receiptData,currency:'USD'}});form=null;screen='wallet';filter='posted';persist()}if(value==='empty'){db[active]=seed();data().posted=[];data().drafts=[];screen='wallet';filter='posted';form=null;persist()}if(value==='readonly'){form=null;screen='wallet';filter='posted'}if(value==='expired'){screen='expired';form=null}if(value==='mismatch'||value==='unreadable'){if(data().currency!=='CRC'){db[active]=seed();persist()}form=newForm();screen='editor';step=active==='b'?1:2;receiptOpen=true;analysis='idle'}renderApp()}
function processAction(action,el){if(scenario==='readonly'&&['edit','resume','type','tag','discard','discard-confirm','delete','delete-confirm','analyze','remove-receipt','confirm-amount','add-attachments','remove-attachment'].includes(action)){toast('Modo consulta: no se permiten cambios.');return}if(attaching&&['go-step','manual','review-receipt','back-step','discard','remove-receipt','reset'].includes(action)){toast('Esperá a que terminemos de agregar los archivos.');return}switch(action){case'focus':document.body.classList.add('demo-focus');window.scrollTo(0,0);break;case'unfocus':document.body.classList.remove('demo-focus');window.scrollTo(0,0);break;case'new':navigateScreen(startNew);break;case'wallet':navigateScreen(()=>{form=null;screen='wallet';filter='posted';renderApp()});break;case'home':navigateScreen(()=>{form=null;screen='home';renderApp()});break;case'new-wallet':openDialog('Crear otro bolsillo','Este prototipo se concentra en movimientos. La propuesta para crear bolsillos conserva el formulario actual y agrega una invitación al primer movimiento.',btn('Volver a mis bolsillos','dialog-close','primary'));break;case'archive-demo':scenario='readonly';screen='wallet';filter='posted';render();break;case'posted':filter='posted';search='';screen=active==='c'?'wallet':screen;renderApp();break;case'drafts':filter='drafts';search='';screen='wallet';renderApp();break;case'clear-search':search='';renderApp();$('#search')?.focus();break;case'view':navigateScreen(()=>showDetail(el.dataset.id));break;case'edit':editMovement();break;case'resume':navigateScreen(()=>resume(el.dataset.id));break;case'next-draft':case'jump-draft':navigateScreen(()=>{if(!data().drafts.length){screen='wallet';filter='drafts';renderApp();toast('No quedan pendientes. Creá uno con «Continuar después».')}else resume(data().drafts[0].id)});break;case'jump-view':navigateScreen(()=>{if(data().posted.length)showDetail(data().posted[0].id);else toast('Agregá un movimiento para consultar su detalle.')});break;case'jump-edit':navigateScreen(()=>{if(data().posted.length){selectedId=data().posted[0].id;editMovement()}else toast('Agregá un movimiento para editarlo.')});break;case'type':form.type=el.dataset.value;changed();renderApp();break;case'tag':form.tags=form.tags.includes(el.dataset.value)?form.tags.filter(t=>t!==el.dataset.value):[...form.tags,el.dataset.value];changed();el.setAttribute('aria-pressed',form.tags.includes(el.dataset.value));break;case'leave':leave();break;case'discard':openDialog('¿Descartar este borrador?',form.targetId?'Se eliminarán los cambios pendientes. El movimiento original y su saldo se conservarán.':'Se eliminarán los datos y los archivos de este borrador. El saldo no cambiará.',`${btn('Seguir editando','dialog-close','primary')}${btn('Descartar borrador','discard-confirm','danger')}`);break;case'discard-confirm':clearTimeout(saveTimer);data().drafts=data().drafts.filter(d=>d.id!==form?.id);persist();form=null;screen='wallet';filter='drafts';closeDialog();renderApp();toast('Borrador descartado. El saldo no cambió.');break;case'delete':{const m=data().posted.find(m=>m.id===selectedId);openDialog('¿Eliminar este movimiento?',`Se eliminará «${esc(m.description)}» por ${money(minor(m.amount))}${active==='b'&&attachmentCount(m)?' y sus archivos adjuntos':m.receipt?' y su comprobante':''}. El saldo pasará de ${money(balance())} a ${money(balance()-contribution(m))}. Esta acción es permanente.`,`${btn('Conservar movimiento','dialog-close','primary')}${btn('Eliminar definitivamente','delete-confirm','danger')}`);break}case'delete-confirm':data().posted=data().posted.filter(m=>m.id!==selectedId);data().drafts=data().drafts.filter(d=>d.targetId!==selectedId);persist();closeDialog();screen='wallet';filter='posted';renderApp();toast('Movimiento eliminado. Saldo actualizado.');break;case'add-attachments':$('#attachment-picker')?.click();break;case'attachment-view':viewAttachment(el.dataset.id);break;case'remove-attachment':form.attachments=(form.attachments||[]).filter(file=>file.id!==el.dataset.id);delete errors.attachments;changed();renderApp();$('#attachment-add')?.focus({preventScroll:true});toast('Archivo quitado. Los datos del movimiento se conservan.');break;case'analyze':analyze();break;case'manual':analysisVersion++;step=2;receiptOpen=false;analysis='idle';renderApp();$('#amount')?.focus();break;case'review-receipt':form.captureOnly=false;step=2;receiptOpen=false;renderApp();$('#amount')?.focus();break;case'remove-receipt':form.receipt=false;form.reviewed=true;delete errors.attachments;changed();renderApp();$('#attachment-add')?.focus({preventScroll:true});break;case'confirm-amount':if(!minor(form.amount)){errors.amount='Ingresá un monto válido antes de confirmarlo.';renderApp();$('#amount')?.focus();break}form.reviewed=true;changed();errors.amount='';renderApp();toast('Monto revisado. Podés continuar.');break;case'receipt-view':{const m=form||data().posted.find(m=>m.id===selectedId);openDialog('Comprobante de ejemplo','Documento ficticio para evaluar la consulta y revisión.',receiptMarkup(m)+btn('Volver a los datos','dialog-close','primary'));break}case'go-step':{const target=Number(el.dataset.step);if(active==='b'&&screen==='editor'&&!form?.submitting&&target>=1&&target<step){step=target;renderApp();focusEditor()}break}case'back-step':step=2;renderApp();break;case'dialog-close':closeDialog();break;case'retry-leave':if(scenario==='offline'){toast('La simulación de falla sigue activa. Seguí editando y elegí «Uso normal».');break}if(stash()){closeDialog();const fn=queuedNavigation;queuedNavigation=null;fn?.()}else toast('El navegador no permite guardar. Tus datos siguen en esta pestaña.');break;case'force-leave':clearTimeout(saveTimer);if(form?.id)data().drafts=data().drafts.filter(d=>d.id!==form.id);persist();form=null;closeDialog();{const fn=queuedNavigation;queuedNavigation=null;fn?.()}break;case'reset':openDialog('¿Reiniciar esta propuesta?','Se restaurarán los movimientos y borradores ficticios de esta propuesta. Tus otras propuestas se conservan.',`${btn('Conservar ejemplo actual','dialog-close')}${btn('Reiniciar datos de ejemplo','reset-confirm','primary')}`);break;case'reset-confirm':clearTimeout(saveTimer);db[active]=seed();persist();form=null;scenario='normal';screen='wallet';filter=active==='c'?'drafts':'posted';search='';closeDialog();render();break;}}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();$('#main').scrollIntoView();return}const el=e.target.closest('[data-action]');if(el&&!el.disabled)processAction(el.dataset.action,el)});
document.addEventListener('input',e=>{if(form&&['amount','description','date','notes'].includes(e.target.name)){form[e.target.name]=e.target.value;changed();if(errors[e.target.name]){delete errors[e.target.name];e.target.setAttribute('aria-invalid','false');const msg=$('#'+e.target.name+'-error');if(msg)msg.remove()}}});
$('#dialog').addEventListener('close',()=>{if(attachmentPreviewUrl){URL.revokeObjectURL(attachmentPreviewUrl);attachmentPreviewUrl=null}});
document.addEventListener('change',e=>{if(e.target.id==='attachment-picker'){addAttachments(e.target.files);return}if(e.target.id==='scenario'){if(screen==='editor'&&form?.dirty&&e.target.value!=='normal'&&e.target.value!=='offline'){const next=e.target.value;navigateScreen(()=>setScenario(next));return}setScenario(e.target.value)}});
document.addEventListener('submit',e=>{if(e.target.id==='movement-form'){e.preventDefault();commit()}});
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('receipt-tool'))receiptOpen=e.target.open},true);
function route(){const next=location.hash.slice(1).split('/')[0]||'review';const go=()=>{clearTimeout(toastTimer);$('#toast').hidden=true;document.body.classList.remove('demo-focus');page=['review','compare','a','b','c'].includes(next)?next:'review';if(['a','b','c'].includes(page)){active=page;screen='wallet';filter=active==='c'?'drafts':'posted';search='';scenario='normal';form=null}render();window.scrollTo(0,0)};navigateScreen(go)}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{if(form?.dirty&&!stash()){e.preventDefault();e.returnValue=''}});
route();
</script>
</body></html>
